services:
  # Primary Obsidian instance. The pipeline interacts directly with the vault managed
  # by this container to ensure it remains isolated from the host filesystem.
  # Access the Obsidian GUI via a web browser at http://localhost:3000 to configure Sync.
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: copilot-digest-obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    volumes:
      - obsidian_config:/config
      - obsidian_only_vault:/vaults
    ports:
      - "3000:3000"   # KasmVNC web GUI - http://localhost:3000
      - "3001:3001"   # KasmVNC web GUI - https
    restart: unless-stopped
    shm_size: "1gb"

  pipeline:
    build: .
    image: copilot-digest-pipeline:latest
    container_name: copilot-digest-pipeline
    env_file:
      - .env
    environment:
      - TZ=Asia/Singapore
    volumes:
      # Isolated vault, managed by the standalone obsidian container above.
      - obsidian_only_vault:/vault
      - ./data:/work
    restart: unless-stopped

  # NotebookLM-style chat over the vault (read-only). Reuses the pipeline image -
  # no build: block of its own - just a different command.
  vault-qa:
    image: copilot-digest-pipeline:latest
    container_name: copilot-digest-vault-qa
    depends_on:
      - pipeline
    command: ["python3", "scripts/vault_web.py"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Singapore
    volumes:
      - obsidian_only_vault:/vault:ro
      # Durable chat history (SQLite). The vault mount is read-only, so the
      # session store lives here instead - survives container rebuilds.
      - ./data/vault-qa:/data
      # Mount the project root so vault-qa can read/edit configuration files from the UI
      - ./:/host
      # Mount the docker socket so vault-qa can issue container restarts
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8420:8420"
    restart: unless-stopped

volumes:
  obsidian_only_vault:
  obsidian_config:
