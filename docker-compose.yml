services:
  # Primary Obsidian instance. The pipeline interacts directly with the vault managed
  # by this container to ensure it remains isolated from the host filesystem.
  # Access the Obsidian GUI via a web browser at http://localhost:3000 to configure Sync.
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: copilot-digest-obsidian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Singapore
    volumes:
      - obsidian_config:/config
      - obsidian_only_vault:/vaults
    ports:
      - "3000:3000"   # KasmVNC web GUI - http://localhost:3000
      - "3001:3001"   # KasmVNC web GUI - https
    restart: unless-stopped
    shm_size: "1gb"

  pipeline:
    build: .
    image: copilot-digest-pipeline:latest
    container_name: copilot-digest-pipeline
    env_file:
      - .env
    environment:
      - TZ=Asia/Singapore
    # Lets LLM_BASE_URL reach a local model server on the host (e.g. Ollama at
    # http://host.docker.internal:11434/v1). Built into Docker Desktop; this
    # mapping makes it work on Linux hosts too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Isolated vault, managed by the standalone obsidian container above.
      - obsidian_only_vault:/vault
      - ./data:/work
      # The crontab and prompts are baked into the image at build time; these
      # bind-mounts overlay the live host copies so edits from the settings
      # page actually apply (prompts on the next run, crontab after a restart)
      # instead of waiting for the next image rebuild.
      - ./crontab:/app/crontab:ro
      - ./prompt_template.txt:/app/prompt_template.txt:ro
      - ./prompt_dry_run.txt:/app/prompt_dry_run.txt:ro
      - ./prompt_personal_email.txt:/app/prompt_personal_email.txt:ro
      - ./prompt_personal_email_dry_run.txt:/app/prompt_personal_email_dry_run.txt:ro
      - ./prompt_telegram.txt:/app/prompt_telegram.txt:ro
      - ./prompt_telegram_dry_run.txt:/app/prompt_telegram_dry_run.txt:ro
      - ./prompt_whatsapp.txt:/app/prompt_whatsapp.txt:ro
      - ./prompt_whatsapp_dry_run.txt:/app/prompt_whatsapp_dry_run.txt:ro
      - ./prompt_vault_profile.txt:/app/prompt_vault_profile.txt:ro
      - ./prompt_weekly_rollup.txt:/app/prompt_weekly_rollup.txt:ro
    restart: unless-stopped

  # Always-on WhatsApp bridge (Baileys, Node). Maintains the linked-device
  # session and appends messages to ./data/whatsapp/ for fetch_whatsapp.py to
  # file nightly. Shares the ./data volume with the pipeline (as /work).
  whatsapp-bridge:
    build: ./bridge
    image: copilot-digest-whatsapp-bridge:latest
    container_name: copilot-digest-whatsapp-bridge
    env_file:
      - .env
    environment:
      - TZ=Asia/Singapore
    volumes:
      - ./data:/work
    restart: unless-stopped

  # NotebookLM-style chat over the vault (read-only). Reuses the pipeline image -
  # no build: block of its own - just a different command.
  vault-qa:
    image: copilot-digest-pipeline:latest
    container_name: copilot-digest-vault-qa
    depends_on:
      - pipeline
    command: ["python3", "scripts/vault_web.py"]
    env_file:
      - .env
    environment:
      - TZ=Asia/Singapore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - obsidian_only_vault:/vault:ro
      # Durable chat history (SQLite). The vault mount is read-only, so the
      # session store lives here instead - survives container rebuilds.
      - ./data/vault-qa:/data
      # Mount the project root so vault-qa can read/edit configuration files from the UI
      - ./:/host
      # Mount the docker socket so vault-qa can issue container restarts
      - /var/run/docker.sock:/var/run/docker.sock
      # The simulator runs the agent in this container against /app prompts;
      # overlay the live host copies (same rationale as the pipeline mounts).
      - ./prompt_dry_run.txt:/app/prompt_dry_run.txt:ro
      - ./prompt_personal_email_dry_run.txt:/app/prompt_personal_email_dry_run.txt:ro
      - ./prompt_telegram_dry_run.txt:/app/prompt_telegram_dry_run.txt:ro
      - ./prompt_whatsapp_dry_run.txt:/app/prompt_whatsapp_dry_run.txt:ro
    ports:
      - "8420:8420"
    restart: unless-stopped

volumes:
  obsidian_only_vault:
  obsidian_config:
