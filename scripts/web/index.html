<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e1e; color: #e8e8e8;
  }
  header { padding: 0.75rem 1rem; border-bottom: 1px solid #333; font-weight: 600; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 10px; line-height: 1.45; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2b5797; }
  .msg.assistant { align-self: flex-start; background: #2e2e2e; }
  .msg.error { align-self: flex-start; background: #5a2323; }
  .progress { align-self: flex-start; font-size: 0.85rem; color: #999; font-style: italic; }
  .sources { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .source-chip {
    font-size: 0.8rem; padding: 0.15rem 0.55rem; border-radius: 999px;
    background: #3a3a3a; color: #cfe; text-decoration: none; border: 1px solid #4a4a4a;
  }
  .source-chip:hover { background: #454545; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #333; }
  input[type=text] {
    flex: 1; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid #444;
    background: #2a2a2a; color: #e8e8e8; font-size: 1rem;
  }
  button {
    padding: 0.6rem 1.1rem; border-radius: 8px; border: none;
    background: #2b5797; color: white; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #1a1a1a; }
    header { border-color: #ddd; }
    .msg.assistant { background: #eee; }
    .msg.error { background: #fbdede; }
    .source-chip { background: #e4e4e4; color: #245; border-color: #ccc; }
    input[type=text] { background: #fff; color: #1a1a1a; border-color: #ccc; }
    form { border-color: #ddd; }
  }
</style>
</head>
<body>
<header id="title">Vault Chat</header>
<div id="log"></div>
<form id="form">
  <input id="input" type="text" autocomplete="off" placeholder="Ask your vault anything...">
  <button id="send" type="submit">Send</button>
</form>
<script>
let sessionId = localStorage.getItem("vault_qa_session_id") || null;
let vaultName = "vault";

fetch("/api/meta").then(r => r.json()).then(d => {
  vaultName = d.vault_name || vaultName;
  document.getElementById("title").textContent = `Chat with "${vaultName}"`;
}).catch(() => {});

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function addProgress(text) {
  const div = document.createElement("div");
  div.className = "progress";
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function renderInline(text) {
  // Minimal, dependency-free markdown: **bold** and bullet lines only.
  const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function addAnswer(answer, sources) {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = renderInline(answer || "");
  if (sources && sources.length) {
    const row = document.createElement("div");
    row.className = "sources";
    for (const s of sources) {
      const a = document.createElement("a");
      a.className = "source-chip";
      const notePath = s.replace(/\.md$/, "");
      a.href = `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(notePath)}`;
      a.textContent = notePath.split("/").pop();
      a.title = s;
      row.appendChild(a);
    }
    div.appendChild(row);
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

async function ask(message) {
  sendBtn.disabled = true;
  input.disabled = true;
  const progressEl = addProgress("thinking...");

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      progressEl.remove();
      addMsg(body.error || `Request failed (${resp.status})`, "error");
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let lastProgress = progressEl;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame || frame.startsWith(":")) continue;

        let eventType = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) eventType = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const payload = JSON.parse(data);

        if (eventType === "session") {
          sessionId = payload.session_id;
          localStorage.setItem("vault_qa_session_id", sessionId);
        } else if (eventType === "progress") {
          lastProgress.remove();
          const argStr = Object.values(payload.args || {}).join(" ");
          lastProgress = addProgress(`${payload.tool}: ${argStr}`.trim());
        } else if (eventType === "answer") {
          lastProgress.remove();
          addAnswer(payload.answer, payload.sources);
        } else if (eventType === "error") {
          lastProgress.remove();
          addMsg(payload.message || "Unknown error", "error");
        }
      }
    }
  } catch (err) {
    progressEl.remove();
    addMsg("Connection error: " + err.message, "error");
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  ask(text);
});
</script>
</body>
</html>
