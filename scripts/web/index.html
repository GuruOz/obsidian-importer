<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vault Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1e1e1e; color: #e8e8e8;
  }
  #app { display: flex; height: 100vh; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { padding: 0.6rem 1rem; border-bottom: 1px solid #333; font-weight: 600;
           display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  #title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #new-chat, #sb-toggle, #export-btn { font-size: 0.85rem; padding: 0.35rem 0.8rem; background: #3a3a3a; }
  #new-chat:hover, #sb-toggle:hover, #export-btn:hover { background: #454545; }
  #sb-toggle { padding: 0.35rem 0.6rem; }

  /* --- export menu --- */
  #export-wrap { position: relative; }
  #export-menu {
    position: absolute; right: 0; top: calc(100% + 0.3rem); z-index: 20;
    display: flex; flex-direction: column; min-width: 10rem;
    background: #2a2a2a; border: 1px solid #4a4a4a; border-radius: 8px;
    overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #export-menu button {
    background: none; border: none; border-radius: 0; color: inherit;
    font-size: 0.85rem; text-align: left; padding: 0.5rem 0.8rem;
  }
  #export-menu button:hover { background: #3a3a3a; }
  /* our display:flex would otherwise beat the UA's [hidden]{display:none} */
  #export-menu[hidden] { display: none; }

  /* --- per-answer feedback --- */
  .fb-btn {
    background: none; border: none; padding: 0 0.15rem; font-size: 0.85rem;
    cursor: pointer; filter: grayscale(1); opacity: 0.55;
  }
  .fb-btn:hover { opacity: 0.9; }
  .fb-btn.on { filter: none; opacity: 1; }
  .fb-row { margin-top: 0.4rem; display: flex; gap: 0.25rem; }

  /* --- conversation history sidebar --- */
  #sidebar {
    width: 260px; flex-shrink: 0; display: flex; flex-direction: column;
    background: #181818; border-right: 1px solid #333; overflow: hidden;
  }
  #sidebar.collapsed { display: none; }
  #sidebar-head { padding: 0.75rem 1rem 0.4rem; font-size: 0.78rem; font-weight: 600;
                  color: #888; text-transform: uppercase; letter-spacing: 0.04em; }
  #sess-search {
    display: block; width: calc(100% - 1.2rem); margin: 0 0.6rem 0.4rem;
    padding: 0.35rem 0.6rem; border-radius: 6px; border: 1px solid #3a3a3a;
    background: #222; color: inherit; font-size: 0.82rem; font-family: inherit;
  }
  #sess-search:focus { outline: none; border-color: #2b5797; }
  .sess-bucket { padding: 0.55rem 1rem 0.15rem; font-size: 0.68rem; font-weight: 600;
                 color: #777; text-transform: uppercase; letter-spacing: 0.05em; }
  .pin-mark { font-size: 0.68rem; flex-shrink: 0; }
  #sess-list { flex: 1; overflow-y: auto; padding-bottom: 0.5rem; }
  .sess {
    display: flex; align-items: center; gap: 0.3rem; padding: 0.45rem 0.6rem;
    margin: 0.1rem 0.4rem; border-radius: 8px; cursor: pointer;
    font-size: 0.85rem; color: #ccc;
  }
  .sess:hover { background: #2a2a2a; }
  .sess.active { background: #333; color: #fff; }
  .sess-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess-act { display: none; gap: 0.1rem; flex-shrink: 0; }
  .sess:hover .sess-act { display: flex; }
  .sess-act button { background: none; border: none; color: #999; cursor: pointer;
                     padding: 0 0.2rem; font-size: 0.85rem; line-height: 1; }
  .sess-act button:hover { color: #fff; }
  .sess-edit { flex: 1; min-width: 0; font: inherit; background: #222; color: inherit;
               border: 1px solid #555; border-radius: 4px; padding: 0.1rem 0.3rem; }
  #sess-empty { padding: 0.4rem 1rem; font-size: 0.8rem; color: #666; font-style: italic; }
  #statusbar { padding: 0.15rem 1rem 0.3rem; font-size: 0.75rem; color: #888; }
  #scroll-down {
    position: fixed; right: 1.5rem; bottom: 5.5rem; display: none;
    width: 2.4rem; height: 2.4rem; padding: 0; border-radius: 999px;
    background: #3a3a3a; border: 1px solid #555; font-size: 1.1rem; line-height: 1;
  }
  #scroll-down:hover { background: #454545; }
  .msg.assistant { position: relative; }
  .msg-copy {
    position: absolute; top: 0.35rem; right: 0.35rem; font-size: 0.72rem;
    padding: 0.12rem 0.45rem; border-radius: 6px; background: #3a3a3a; color: #bbb;
    border: 1px solid #4a4a4a; opacity: 0; transition: opacity 0.15s;
  }
  .msg.assistant:hover .msg-copy { opacity: 0.85; }
  .msg-meta { margin-top: 0.5rem; font-size: 0.72rem; color: #888; }
  .regen-row { margin-top: 0.45rem; }
  .regen-btn, .retry-btn {
    font-size: 0.78rem; padding: 0.2rem 0.6rem; background: #3a3a3a; color: #ccc;
    border: 1px solid #4a4a4a; border-radius: 6px;
  }
  .regen-btn:hover, .retry-btn:hover { background: #454545; }
  .retry-btn { margin-top: 0.45rem; display: block; }
  #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
  .msg { max-width: 80%; padding: 0.6rem 0.9rem; border-radius: 10px; line-height: 1.45; }
  .msg.user { align-self: flex-end; background: #2b5797; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: #2e2e2e; }
  .msg.error { align-self: flex-start; background: #5a2323; white-space: pre-wrap; }
  .progress { align-self: flex-start; font-size: 0.85rem; color: #999; font-style: italic; }
  .sources { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .source-chip {
    font-size: 0.8rem; padding: 0.15rem 0.55rem; border-radius: 999px;
    background: #3a3a3a; color: #cfe; text-decoration: none; border: 1px solid #4a4a4a;
  }
  .source-chip:hover { background: #454545; }
  form { display: flex; gap: 0.5rem; padding: 0.75rem; border-top: 1px solid #333; align-items: flex-end; }
  textarea#input {
    flex: 1; padding: 0.6rem 0.8rem; border-radius: 8px; border: 1px solid #444;
    background: #2a2a2a; color: #e8e8e8; font-size: 1rem; font-family: inherit;
    resize: none; max-height: 200px; overflow-y: auto; line-height: 1.4;
  }
  button {
    padding: 0.6rem 1.1rem; border-radius: 8px; border: none;
    background: #2b5797; color: white; font-size: 1rem; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  /* --- rendered markdown --- */
  .md p { margin: 0.4em 0; }
  .md p:first-child { margin-top: 0; }
  .md p:last-child { margin-bottom: 0; }
  .md ul, .md ol { margin: 0.4em 0; padding-left: 1.4em; }
  .md li { margin: 0.15em 0; }
  .md h1, .md h2, .md h3, .md h4 { margin: 0.7em 0 0.35em; line-height: 1.25; }
  .md h1 { font-size: 1.25em; } .md h2 { font-size: 1.15em; }
  .md h3 { font-size: 1.05em; } .md h4 { font-size: 1em; }
  .md blockquote { margin: 0.4em 0; padding: 0.1em 0.8em; border-left: 3px solid #555; color: #bbb; }
  .md hr { border: none; border-top: 1px solid #444; margin: 0.7em 0; }
  .md a { color: #8ab4f8; }
  .md table { border-collapse: collapse; margin: 0.5em 0; display: block; overflow-x: auto; max-width: 100%; }
  .md th, .md td { border: 1px solid #4a4a4a; padding: 0.3em 0.7em; text-align: left; }
  .md th { background: #383838; }
  .md code { background: #3a3a3a; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em;
             font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .md pre { margin: 0; padding: 0.7em 0.9em; overflow-x: auto; background: #191919;
            border-radius: 8px; border: 1px solid #383838; }
  .md pre code { background: none; padding: 0; font-size: 0.85em; line-height: 1.5; }
  .codewrap { position: relative; margin: 0.5em 0; }
  .code-copy {
    position: absolute; top: 0.4em; right: 0.4em; font-size: 0.75rem;
    padding: 0.15rem 0.5rem; border-radius: 6px; background: #333; color: #ccc;
    border: 1px solid #4a4a4a; opacity: 0.7;
  }
  .code-copy:hover { opacity: 1; }
  .code-lang { position: absolute; top: 0.5em; right: 4.2em; font-size: 0.7rem; color: #777; }
  .tok-kw { color: #c792ea; }
  .tok-str { color: #a5d6a7; }
  .tok-com { color: #808080; font-style: italic; }
  .tok-num { color: #f2b06e; }

  @media (prefers-color-scheme: light) {
    body { background: #fafafa; color: #1a1a1a; }
    header { border-color: #ddd; }
    #sidebar { background: #f0f0f0; border-color: #ddd; }
    #sess-search { background: #fff; border-color: #ccc; }
    .sess { color: #333; }
    .sess:hover { background: #e2e2e2; }
    .sess.active { background: #dcdcdc; color: #000; }
    .sess-act button { color: #777; }
    .sess-act button:hover { color: #000; }
    .sess-edit { background: #fff; border-color: #bbb; }
    #sb-toggle { background: #e4e4e4; color: #1a1a1a; }
    #sb-toggle:hover { background: #d8d8d8; }
    .msg.assistant { background: #eee; }
    .msg.error { background: #fbdede; }
    .source-chip { background: #e4e4e4; color: #245; border-color: #ccc; }
    textarea#input { background: #fff; color: #1a1a1a; border-color: #ccc; }
    form { border-color: #ddd; }
    .md blockquote { border-color: #bbb; color: #555; }
    .md hr { border-top-color: #ddd; }
    .md a { color: #1a56b0; }
    .md th, .md td { border-color: #ccc; }
    .md th { background: #e8e8e8; }
    .md code { background: #e4e4e4; }
    .md pre { background: #f0f0f0; border-color: #ddd; }
    .code-copy { background: #e0e0e0; color: #333; border-color: #ccc; }
    .tok-kw { color: #7c4dbd; } .tok-str { color: #2e7d32; }
    .tok-com { color: #999; } .tok-num { color: #b26a00; }
    #new-chat, #export-btn { background: #e4e4e4; color: #1a1a1a; }
    #new-chat:hover, #export-btn:hover { background: #d8d8d8; }
    #export-menu { background: #fff; border-color: #ccc; box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
    #export-menu button:hover { background: #eee; }
    #scroll-down { background: #e4e4e4; color: #1a1a1a; border-color: #ccc; }
    .msg-copy, .regen-btn, .retry-btn { background: #e0e0e0; color: #333; border-color: #ccc; }
    .regen-btn:hover, .retry-btn:hover, #scroll-down:hover { background: #d8d8d8; }
  }
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
  <div id="sidebar-head">Chats</div>
  <input id="sess-search" type="search" placeholder="Search chats..." autocomplete="off">
  <div id="sess-list"></div>
</aside>
<div id="main">
<header>
  <button id="sb-toggle" type="button" title="Toggle history sidebar">&#9776;</button>
  <span id="title">Vault Chat</span>
  <div id="export-wrap">
    <button id="export-btn" type="button" title="Download this conversation">Export</button>
    <div id="export-menu" hidden>
      <button type="button" data-fmt="md">Markdown (.md)</button>
      <button type="button" data-fmt="json">JSON (.json)</button>
    </div>
  </div>
  <button id="new-chat" type="button" title="Start a fresh conversation (Ctrl/Cmd+K)">New chat</button>
</header>
<div id="log"></div>
<button id="scroll-down" type="button" title="Jump to newest">&#8595;</button>
<div id="statusbar"><span id="ctx-badge"></span></div>
<form id="form">
  <textarea id="input" rows="1" autocomplete="off"
            placeholder="Ask your vault anything...  (Enter to send, Shift+Enter for a new line)"></textarea>
  <button id="send" type="submit">Send</button>
</form>
</div>
</div>
<script>
// __MD_ENGINE_START__
// Dependency-free markdown renderer + lightweight syntax highlighter.
// DOM-free on purpose: everything below builds plain HTML strings, so this whole
// section is unit-testable under Node (see the repo's verification notes).
const CODE_STORE = [];

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

const HL_RE = new RegExp(
  "(\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*|#[^\\n]*)" +                       // comments
  "|(\"(?:[^\"\\\\\\n]|\\\\.)*\"|'(?:[^'\\\\\\n]|\\\\.)*'|`(?:[^`\\\\]|\\\\.)*`)" + // strings
  "|\\b(def|return|if|elif|else|for|while|class|import|from|const|let|var|function|" +
  "async|await|try|except|catch|finally|with|in|not|and|or|None|True|False|null|" +
  "true|false|new|this|self|lambda|pass|raise|yield|switch|case|break|continue|" +
  "type|interface|public|private|static|void|print)\\b" +                   // keywords
  "|\\b(\\d+(?:\\.\\d+)?)\\b", "g");                                        // numbers

function highlight(code) {
  let out = "", last = 0, m;
  HL_RE.lastIndex = 0;
  while ((m = HL_RE.exec(code))) {
    out += escapeHtml(code.slice(last, m.index));
    const cls = m[1] ? "tok-com" : m[2] ? "tok-str" : m[3] ? "tok-kw" : "tok-num";
    out += '<span class="' + cls + '">' + escapeHtml(m[0]) + "</span>";
    last = m.index + m[0].length;
  }
  return out + escapeHtml(code.slice(last));
}

function inline(s) {
  // s is already HTML-escaped. Order matters: code spans first (protect their
  // contents), then links, bold, italic.
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codes.push("<code>" + c + "</code>");
    return "\x01" + (codes.length - 1) + "\x01";
  });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|obsidian:\/\/[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return s.replace(/\x01(\d+)\x01/g, (m, i) => codes[+i]);
}

function renderMarkdown(src) {
  const blocks = [];
  src = src.replace(/```([\w+-]*)[ \t]*\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang: lang, code: code.replace(/\n$/, "") });
    return "\x00" + (blocks.length - 1) + "\x00";
  });

  const lines = escapeHtml(src).split("\n");
  const out = [];
  let para = [];

  function flushPara() {
    if (para.length) {
      out.push("<p>" + para.map(inline).join("<br>") + "</p>");
      para = [];
    }
  }

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    if (/^\x00\d+\x00\s*$/.test(line)) {         // standalone fenced code block
      flushPara();
      out.push(line.trim());
      continue;
    }
    if (/^\s*$/.test(line)) { flushPara(); continue; }

    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { flushPara(); out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">"); continue; }

    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); out.push("<hr>"); continue; }

    if (/^&gt;\s?/.test(line)) {                  // blockquote (already escaped)
      flushPara();
      const quote = [];
      while (i < lines.length && /^&gt;\s?/.test(lines[i])) {
        quote.push(lines[i].replace(/^&gt;\s?/, ""));
        i++;
      }
      i--;
      out.push("<blockquote>" + quote.map(inline).join("<br>") + "</blockquote>");
      continue;
    }

    if (/^[-*]\s+/.test(line) || /^\d+\.\s+/.test(line)) {   // lists
      flushPara();
      const ordered = /^\d+\.\s+/.test(line);
      const items = [];
      const re = ordered ? /^\d+\.\s+/ : /^[-*]\s+/;
      while (i < lines.length && re.test(lines[i])) {
        items.push("<li>" + inline(lines[i].replace(re, "")) + "</li>");
        i++;
      }
      i--;
      const tag = ordered ? "ol" : "ul";
      out.push("<" + tag + ">" + items.join("") + "</" + tag + ">");
      continue;
    }

    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length &&
        /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {            // tables
      flushPara();
      const cells = l => l.replace(/^\||\|\s*$/g, "").split("|").map(c => inline(c.trim()));
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
        rows.push(cells(lines[i]));
        i++;
      }
      i--;
      let t = "<table><thead><tr>" + head.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
      for (const r of rows) t += "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>";
      out.push(t + "</tbody></table>");
      continue;
    }

    para.push(line);
  }
  flushPara();

  return out.join("\n").replace(/\x00(\d+)\x00/g, (m, i) => {
    const b = blocks[+i];
    const ci = CODE_STORE.length;
    CODE_STORE.push(b.code);
    return '<div class="codewrap">' +
           (b.lang ? '<span class="code-lang">' + escapeHtml(b.lang) + "</span>" : "") +
           '<button type="button" class="code-copy" data-ci="' + ci + '">Copy</button>' +
           "<pre><code>" + highlight(b.code) + "</code></pre></div>";
  });
}
// __MD_ENGINE_END__

let sessionId = localStorage.getItem("vault_qa_session_id") || null;
let vaultName = "vault";
let metaNotes = null;
let lastPayload = null;          // last /api/chat body, for Retry
const MSG_STORE = [];            // raw markdown per assistant message, for copy-all

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const ctxBadge = document.getElementById("ctx-badge");
const scrollBtn = document.getElementById("scroll-down");
const sidebar = document.getElementById("sidebar");
const sessList = document.getElementById("sess-list");

function updateBadge(notes, chunks) {
  if (notes == null) { ctxBadge.textContent = ""; return; }
  ctxBadge.textContent = chunks != null
    ? `Grounded on ${notes} vault notes (${chunks} indexed chunks)`
    : `Grounded on ${notes} vault notes`;
}

fetch("/api/meta").then(r => r.json()).then(d => {
  vaultName = d.vault_name || vaultName;
  document.getElementById("title").textContent = `Chat with "${vaultName}"`;
  if (typeof d.notes === "number") { metaNotes = d.notes; updateBadge(metaNotes, null); }
}).catch(() => {});

// --- sticky scroll / jump-to-newest anchor ---
let stickToBottom = true;
log.addEventListener("scroll", () => {
  stickToBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  scrollBtn.style.display = stickToBottom ? "none" : "block";
});
scrollBtn.addEventListener("click", () => {
  log.scrollTop = log.scrollHeight;
});
function maybeScroll() {
  if (stickToBottom) log.scrollTop = log.scrollHeight;
}

// --- session switching & view persistence ---
// Switching sessions keeps each chat's rendered DOM, scroll position, draft
// text, and pending-retry payload in VIEW_CACHE, so flipping back is instant
// and lossless. CODE_STORE/MSG_STORE are global and append-only on purpose:
// cached views hold data-ci/data-mi indexes into them, so they must never be
// truncated while the page lives. A session missing from the cache (page
// reload) is re-hydrated from GET /api/sessions/<id>.
const VIEW_CACHE = new Map();
const sessKey = () => sessionId || "__new__";

function saveView() {
  const v = { frag: document.createDocumentFragment(), scrollTop: log.scrollTop,
              draft: input.value, badge: ctxBadge.textContent, lastPayload };
  while (log.firstChild) v.frag.appendChild(log.firstChild);
  VIEW_CACHE.set(sessKey(), v);
}

function resetView() {
  log.innerHTML = "";
  input.value = "";
  autosize();
  lastPayload = null;
}

function renderTranscript(entries) {
  for (const e of entries || []) {
    if (e.type === "user") addMsg(e.text, "user");
    else if (e.type === "answer") addAnswer(e);
  }
}

async function switchSession(id) {
  if (sendBtn.disabled || id === sessionId) return;
  saveView();
  sessionId = id;
  localStorage.setItem("vault_qa_session_id", sessionId);
  markActive();
  const v = VIEW_CACHE.get(id);
  if (v) {
    VIEW_CACHE.delete(id);           // frag is consumed; re-saved on next switch
    resetView();
    log.appendChild(v.frag);
    input.value = v.draft;
    autosize();
    ctxBadge.textContent = v.badge;
    lastPayload = v.lastPayload;
    log.scrollTop = v.scrollTop;
  } else {
    resetView();
    try {
      const resp = await fetch("/api/sessions/" + encodeURIComponent(id));
      if (!resp.ok) throw new Error("gone");
      const d = await resp.json();
      // Per-session counts only exist while the session is live server-side;
      // stored-but-idle sessions fall back to the vault-wide note count.
      updateBadge(d.notes != null ? d.notes : metaNotes, d.chunks != null ? d.chunks : null);
      renderTranscript(d.transcript);
      log.scrollTop = log.scrollHeight;
    } catch (e) {
      // Session no longer exists server-side (restart/eviction): fall back to
      // a fresh chat rather than showing a dead transcript.
      newChat();
      refreshSidebar();
      return;
    }
  }
  input.focus();
}

// --- sidebar ---
function markActive() {
  for (const el of sessList.querySelectorAll(".sess")) {
    el.classList.toggle("active", el.dataset.id === sessionId);
  }
}

// "Today / Yesterday / ..." section header for a last_used unix timestamp.
function bucketOf(ts) {
  const now = new Date();
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const today = startOfDay(now);
  const day = startOfDay(new Date(ts * 1000));
  if (day >= today) return "Today";
  if (day >= today - 864e5) return "Yesterday";
  if (day >= today - 7 * 864e5) return "Previous 7 days";
  if (day >= today - 30 * 864e5) return "Previous 30 days";
  return "Older";
}

let searchQuery = "";

async function refreshSidebar() {
  let sessions;
  const q = searchQuery;
  try {
    const url = "/api/sessions" + (q ? "?q=" + encodeURIComponent(q) : "");
    sessions = (await (await fetch(url)).json()).sessions || [];
  } catch (e) { return; }
  if (q !== searchQuery) return;   // a newer search superseded this response
  sessList.innerHTML = "";
  if (!sessions.length) {
    const empty = document.createElement("div");
    empty.id = "sess-empty";
    empty.textContent = q ? "No matching chats" : "No chats yet";
    sessList.appendChild(empty);
    return;
  }
  let bucket = null;
  for (const s of sessions) {
    // While searching, results come as one flat list; otherwise the server's
    // pinned-first/recency order maps cleanly onto Pinned + time buckets.
    const label = q ? "Results" : (s.pinned ? "Pinned" : bucketOf(s.last_used));
    if (label !== bucket) {
      bucket = label;
      const head = document.createElement("div");
      head.className = "sess-bucket";
      head.textContent = label;
      sessList.appendChild(head);
    }
    const item = document.createElement("div");
    item.className = "sess";
    item.dataset.id = s.id;
    if (s.pinned) item.dataset.pinned = "1";
    if (s.pinned) {
      const mark = document.createElement("span");
      mark.className = "pin-mark";
      mark.textContent = "\u{1f4cc}";
      item.appendChild(mark);
    }
    const title = document.createElement("span");
    title.className = "sess-title";
    title.textContent = s.title;
    title.title = s.title;
    const act = document.createElement("span");
    act.className = "sess-act";
    const pin = document.createElement("button");
    pin.type = "button"; pin.className = "sess-pin";
    pin.title = s.pinned ? "Unpin" : "Pin";
    pin.textContent = "\u{1f4cc}";
    const ren = document.createElement("button");
    ren.type = "button"; ren.className = "sess-rename";
    ren.title = "Rename"; ren.textContent = "✎";
    const del = document.createElement("button");
    del.type = "button"; del.className = "sess-del";
    del.title = "Delete"; del.textContent = "\u{1f5d1}";
    act.append(pin, ren, del);
    item.append(title, act);
    sessList.appendChild(item);
  }
  markActive();
}

async function togglePin(item) {
  try {
    await fetch("/api/sessions/" + encodeURIComponent(item.dataset.id), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pinned: !item.dataset.pinned }),
    });
  } catch (e) {}
  refreshSidebar();
}

const searchBox = document.getElementById("sess-search");
let searchTimer;
searchBox.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = searchBox.value.trim();
    refreshSidebar();
  }, 200);
});
searchBox.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && searchBox.value) {
    e.stopPropagation();
    searchBox.value = "";
    searchQuery = "";
    refreshSidebar();
  }
});

function startRename(item) {
  const titleEl = item.querySelector(".sess-title");
  if (!titleEl) return;
  const box = document.createElement("input");
  box.className = "sess-edit";
  box.value = titleEl.textContent;
  titleEl.replaceWith(box);
  box.focus();
  box.select();
  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    const title = box.value.trim();
    if (title && title !== titleEl.textContent) {
      try {
        await fetch("/api/sessions/" + encodeURIComponent(item.dataset.id), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title }),
        });
      } catch (e) {}
    }
    refreshSidebar();
  };
  box.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); commit(); }
    else if (e.key === "Escape") { done = true; refreshSidebar(); }
  });
  box.addEventListener("blur", commit);
}

async function deleteSession(id) {
  if (!confirm("Delete this chat?")) return;
  try {
    const resp = await fetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      alert(body.error || "Delete failed");
      return;
    }
  } catch (e) { return; }
  VIEW_CACHE.delete(id);
  if (id === sessionId) newChat();
  refreshSidebar();
}

sessList.addEventListener("click", (e) => {
  const item = e.target.closest(".sess");
  if (!item) return;
  if (e.target.closest(".sess-pin")) { togglePin(item); return; }
  if (e.target.closest(".sess-rename")) { startRename(item); return; }
  if (e.target.closest(".sess-del")) { deleteSession(item.dataset.id); return; }
  if (e.target.closest(".sess-edit")) return;
  switchSession(item.dataset.id);
});

document.getElementById("sb-toggle").addEventListener("click", () => {
  sidebar.classList.toggle("collapsed");
  localStorage.setItem("vault_qa_sidebar",
                       sidebar.classList.contains("collapsed") ? "0" : "1");
});
if (localStorage.getItem("vault_qa_sidebar") === "0") sidebar.classList.add("collapsed");

// --- new chat (button + Ctrl/Cmd+K) ---
function newChat() {
  if (sendBtn.disabled) return;
  if (sessionId) saveView();
  sessionId = null;
  localStorage.removeItem("vault_qa_session_id");
  VIEW_CACHE.delete("__new__");
  resetView();
  updateBadge(metaNotes, null);
  markActive();
  input.focus();
}
document.getElementById("new-chat").addEventListener("click", newChat);
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "o")) {
    e.preventDefault();
    if (!sendBtn.disabled) newChat();
  }
});

function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(t).then(() => true, () => fallbackCopy(t));
  }
  return Promise.resolve(fallbackCopy(t));   // plain-HTTP LAN: clipboard API unavailable
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

log.addEventListener("click", (e) => {
  const codeBtn = e.target.closest(".code-copy");
  if (codeBtn) {
    copyText(CODE_STORE[+codeBtn.dataset.ci] || "").then(ok => {
      codeBtn.textContent = ok ? "Copied" : "Failed";
      setTimeout(() => { codeBtn.textContent = "Copy"; }, 1500);
    });
    return;
  }
  const msgBtn = e.target.closest(".msg-copy");
  if (msgBtn) {
    copyText(MSG_STORE[+msgBtn.dataset.mi] || "").then(ok => {
      msgBtn.textContent = ok ? "Copied" : "Failed";
      setTimeout(() => { msgBtn.textContent = "Copy"; }, 1500);
    });
    return;
  }
  const regenBtn = e.target.closest(".regen-btn");
  if (regenBtn && !sendBtn.disabled) {
    regenBtn.closest(".msg.assistant").remove();
    ask({ regenerate: true });
    return;
  }
  const retryBtn = e.target.closest(".retry-btn");
  if (retryBtn && !sendBtn.disabled && lastPayload) {
    retryBtn.closest(".msg.error").remove();
    ask(lastPayload);
    return;
  }
  const fbBtn = e.target.closest(".fb-btn");
  if (fbBtn && sessionId) {
    const msg = fbBtn.closest(".msg.assistant");
    // The Nth assistant bubble in the log is the Nth answer in the transcript
    // (regenerate replaces the last one in both places).
    const idx = [...log.querySelectorAll(".msg.assistant")].indexOf(msg);
    const rating = fbBtn.classList.contains("on") ? null : fbBtn.dataset.rating;
    for (const b of msg.querySelectorAll(".fb-btn")) {
      b.classList.toggle("on", b.dataset.rating === rating);
    }
    fetch("/api/sessions/" + encodeURIComponent(sessionId) + "/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ answer_index: idx, rating }),
    }).catch(() => {});
  }
});

// --- chat export (Markdown / JSON) ---
const exportBtn = document.getElementById("export-btn");
const exportMenu = document.getElementById("export-menu");
exportBtn.addEventListener("click", () => {
  exportMenu.hidden = !exportMenu.hidden;
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#export-wrap")) exportMenu.hidden = true;
});

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function transcriptToMarkdown(d) {
  const lines = ["# " + (d.title || "Vault chat"), "",
                 `_Exported ${new Date().toISOString().slice(0, 10)} from vault "${vaultName}"_`, ""];
  for (const e of d.transcript || []) {
    if (e.type === "user") {
      lines.push("## You", "", e.text || "", "");
    } else if (e.type === "answer") {
      lines.push("## Assistant", "", e.answer || "");
      if (e.sources && e.sources.length) lines.push("", "**Sources:** " + e.sources.join(", "));
      lines.push("");
    }
  }
  return lines.join("\n");
}

exportMenu.addEventListener("click", async (e) => {
  const fmt = e.target.closest("button[data-fmt]");
  if (!fmt) return;
  exportMenu.hidden = true;
  if (!sessionId) return;
  let d;
  try {
    const resp = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
    if (!resp.ok) return;
    d = await resp.json();
  } catch (err) { return; }
  const base = (d.title || "vault-chat").replace(/[^\w\- ]+/g, "").trim().slice(0, 60) || "vault-chat";
  if (fmt.dataset.fmt === "json") {
    const payload = { title: d.title, session_id: d.id, created: d.created,
                      exported: new Date().toISOString(), vault: vaultName,
                      transcript: d.transcript };
    downloadBlob(new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" }),
                 base + ".json");
  } else {
    downloadBlob(new Blob([transcriptToMarkdown(d)], { type: "text/markdown" }),
                 base + ".md");
  }
});

function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 200) + "px";
}
input.addEventListener("input", autosize);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!sendBtn.disabled && input.value.trim()) form.requestSubmit();
  }
});

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  log.appendChild(div);
  maybeScroll();
  return div;
}

function addError(text) {
  const div = addMsg(text, "error");
  if (lastPayload) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "retry-btn";
    btn.textContent = "Retry";
    div.appendChild(btn);
  }
  return div;
}

function addProgress(text) {
  const div = document.createElement("div");
  div.className = "progress";
  div.textContent = text;
  log.appendChild(div);
  maybeScroll();
  return div;
}

function addAnswer(payload) {
  // Only the newest answer offers Regenerate.
  const prevRegen = log.querySelector(".regen-row");
  if (prevRegen) prevRegen.remove();

  const div = document.createElement("div");
  div.className = "msg assistant md";
  div.innerHTML = renderMarkdown(payload.answer || "");

  const mi = MSG_STORE.length;
  MSG_STORE.push(payload.answer || "");
  const copyBtn = document.createElement("button");
  copyBtn.type = "button";
  copyBtn.className = "msg-copy";
  copyBtn.dataset.mi = mi;
  copyBtn.textContent = "Copy";
  div.appendChild(copyBtn);

  const sources = payload.sources || [];
  if (sources.length) {
    const row = document.createElement("div");
    row.className = "sources";
    for (const s of sources) {
      const a = document.createElement("a");
      a.className = "source-chip";
      const notePath = s.replace(/\.md$/, "");
      a.href = `obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(notePath)}`;
      a.textContent = notePath.split("/").pop();
      a.title = s;
      row.appendChild(a);
    }
    div.appendChild(row);
  }

  const metaBits = [];
  if (payload.usage && (payload.usage.input_tokens || payload.usage.output_tokens)) {
    metaBits.push(`↑${payload.usage.input_tokens || 0} ↓${payload.usage.output_tokens || 0} tokens`);
  }
  if (payload.elapsed != null) metaBits.push(`${payload.elapsed}s`);
  if (metaBits.length) {
    const meta = document.createElement("div");
    meta.className = "msg-meta";
    meta.textContent = metaBits.join(" · ");
    div.appendChild(meta);
  }

  const fbRow = document.createElement("div");
  fbRow.className = "fb-row";
  for (const rating of ["up", "down"]) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "fb-btn" + (payload.feedback === rating ? " on" : "");
    btn.dataset.rating = rating;
    btn.title = rating === "up" ? "Good response" : "Bad response";
    btn.textContent = rating === "up" ? "\u{1f44d}" : "\u{1f44e}";
    fbRow.appendChild(btn);
  }
  div.appendChild(fbRow);

  const regenRow = document.createElement("div");
  regenRow.className = "regen-row";
  const regenBtn = document.createElement("button");
  regenBtn.type = "button";
  regenBtn.className = "regen-btn";
  regenBtn.textContent = "↻ Regenerate";
  regenRow.appendChild(regenBtn);
  div.appendChild(regenRow);

  log.appendChild(div);
  maybeScroll();
}

async function ask(payload) {
  lastPayload = payload;
  sendBtn.disabled = true;
  input.disabled = true;
  const progressEl = addProgress(payload.regenerate ? "regenerating..." : "thinking...");

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: payload.message || "",
                             regenerate: !!payload.regenerate,
                             session_id: sessionId }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      progressEl.remove();
      addError(body.error || `Request failed (${resp.status})`);
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    let lastProgress = progressEl;

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame || frame.startsWith(":")) continue;

        let eventType = "message", data = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) eventType = line.slice(6).trim();
          else if (line.startsWith("data:")) data += line.slice(5).trim();
        }
        if (!data) continue;
        const evt = JSON.parse(data);

        if (eventType === "session") {
          sessionId = evt.session_id;
          localStorage.setItem("vault_qa_session_id", sessionId);
          if (typeof evt.notes === "number") updateBadge(evt.notes, evt.chunks);
        } else if (eventType === "progress") {
          lastProgress.remove();
          const argStr = Object.values(evt.args || {}).join(" ");
          lastProgress = addProgress(`${evt.tool}: ${argStr}`.trim());
        } else if (eventType === "answer") {
          lastProgress.remove();
          addAnswer(evt);
          lastPayload = null;   // completed successfully; nothing to retry
        } else if (eventType === "error") {
          lastProgress.remove();
          addError(evt.message || "Unknown error");
        }
      }
    }
  } catch (err) {
    progressEl.remove();
    addError("Connection error: " + err.message);
  } finally {
    sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
    refreshSidebar();   // new session / fresh title / recency reorder
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, "user");
  input.value = "";
  autosize();
  ask({ message: text });
});

// --- initial load: populate sidebar and re-hydrate the last-open session ---
refreshSidebar();
if (sessionId) {
  (async () => {
    try {
      const resp = await fetch("/api/sessions/" + encodeURIComponent(sessionId));
      if (!resp.ok) throw new Error("gone");
      const d = await resp.json();
      updateBadge(d.notes != null ? d.notes : metaNotes, d.chunks != null ? d.chunks : null);
      renderTranscript(d.transcript);
      log.scrollTop = log.scrollHeight;
    } catch (e) {
      // Session was deleted (or the store was wiped) since last visit.
      sessionId = null;
      localStorage.removeItem("vault_qa_session_id");
    }
  })();
}
